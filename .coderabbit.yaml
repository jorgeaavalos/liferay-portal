# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for the liferay-portal review fork.
#
# This fork exists only as a CodeRabbit review target: branches are opened
# against it so CodeRabbit reviews them, and nothing here ships upstream.
#
# Two goals, in order:
#   1. Do not spend tokens on generated code. Service Builder, REST Builder,
#      buildLang and bnd account for tens of thousands of files that no human
#      edits by hand; reviewing them is pure cost and pure noise.
#   2. Review the things a Liferay reviewer would actually stop a PR for.

language: en-US

early_access: false

# The review is read by an agent as well as by a person. Findings need to be
# actionable without a second round trip: name the file and line, state the
# concrete failure, and skip the preamble.
tone_instructions: >-
  Lead with the defect, not a summary. Name the file, line, and the input or
  condition that breaks. Do not restate what the diff does. Skip style points
  the repo's own formatter does not enforce. If unsure, say so and say what
  would confirm it.
reviews:
  # "chill" suppresses the low-value nit stream. Real defects still surface.
  profile: chill

  # Never block a PR on the bot's say-so; a human owns that decision.
  request_changes_workflow: false

  high_level_summary: true
  review_status: true

  # Emits findings in a form an AI agent can act on directly, which is the
  # point of this fork. Default is already true; set explicitly so a schema
  # change cannot quietly turn it off.
  enable_prompt_for_ai_agents: true

  # Everything below defaults to TRUE and costs tokens on every review without
  # changing what gets fixed. Turned off deliberately.
  sequence_diagrams: false
  changed_files_summary: false
  in_progress_fortune: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  # We track work in Jira, not GitHub issues, so there is nothing to assess.
  assess_linked_issues: false
  # Measured unreliable: on PR #47 a one-line change was rated
  # "5 (Critical) | ~120 minutes" because upstream drift dominated the diff.
  estimate_code_review_effort: false

  # Collapsed by default: the walkthrough is useful on demand, not inline.
  collapse_walkthrough: true

  # Pure token cost, no review value.
  poem: false

  auto_review:
    enabled: true
    # Drafts are work in progress; reviewing them burns budget on code that
    # is about to change.
    drafts: false
    # Matches the push-per-round loop the rabbit-review skill drives.
    auto_incremental_review: true
    # Review PRs target a per-branch review-base/<name> built by
    # review-branches.sh, not master, so their diff is exactly the branch's
    # own commits.
    base_branches:
      - "review-base/.*"

  path_filters:
    # --- Generated code: never hand-edited, regenerated by a tool ---
    # Service Builder output (~19k files carry the @generated tag)
    - "!**/service/persistence/impl/*PersistenceImpl.java"
    - "!**/service/persistence/*Util.java"
    - "!**/model/impl/*ModelImpl.java"
    - "!**/model/impl/*BaseImpl.java"
    - "!**/model/impl/*CacheModel.java"
    - "!**/model/*Wrapper.java"
    - "!**/service/*ServiceUtil.java"
    - "!**/service/*ServiceWrapper.java"
    - "!**/service/*ServiceBaseImpl.java"
    - "!**/service/http/*ServiceHttp.java"
    - "!**/service/http/*ServiceSoap.java"
    - "!**/META-INF/module-hbm.xml"
    - "!**/META-INF/portlet-model-hints.xml"
    - "!**/META-INF/sql/**"
    # REST Builder output (~6.8k files carry @Generated(""))
    - "!**/rest/dto/**/*.java"
    - "!**/rest/client/**/*.java"
    - "!**/*SerDes.java"
    - "!**/Base*ResourceImpl.java"
    - "!**/Base*ResourceTestCase.java"
    - "!**/OpenAPIResource*.java"
    # buildLang output: only the source Language.properties is hand-written
    - "!**/Language_*.properties"
    # bnd baseline output
    - "!**/packageinfo"
    # Build and dependency noise
    - "!**/*.min.js"
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/package-lock.json"
    - "!**/yarn.lock"

  path_instructions:
    - path: "**/*.java"
      instructions: |-
        Do NOT flag these — they are correct Liferay conventions the source formatter enforces:
        - underscore-prefixed private fields and methods (e.g. _fooBar)
        - `private static` fields placed at the BOTTOM of the class, not the top
        - utility classes with no private constructor and not declared `final`
        - `Thread.currentThread().interrupt();` split across two lines
        - files ending without a trailing newline
        Do not raise import-ordering, whitespace, line-wrapping, or other pure formatting nits; the source formatter owns them.

        DO flag these semantic defects (the source formatter cannot see them):
        - A ResultSet/PreparedStatement/InputStream/ServiceTracker/ExecutorService opened but not closed on every path including exceptions; a JDBC ResultSet must be in try-with-resources.
        - Anything registered or opened in @Activate or a constructor (ServiceTracker.open, addServiceListener, ExecutorService.submit) with no matching close/remove/shutdown/unregister in @Deactivate.
        - A *LocalService @Reference used in a REST resource impl or any user-facing @Component: user-facing code must call the remote *Service (which enforces permissions); *LocalService skips them.
        - A field read from a deserialized request body and used without a null guard: OpenAPI `required` is not enforced server-side, so guard with Validator.isNull(...) and throw BadRequestException rather than letting a null cause a 500.
        - A PATCH or partial update that defaults an absent (null) field to a constant (true/false/0) instead of the entity's current persisted value.
        - A database or service call inside a for/while/stream loop (N+1): collect the IDs first and make one batched call. Exception: a deleteCompany*/deleteCompanyX(long companyId) service method that loops calling the single-entity delete. That loop is mandatory, not an oversight, because the per-entity delete fires model listeners and removes Resource/ResourcePermission rows; batching skips both and orphans them. Liferay has no batch delete that preserves that lifecycle, and the established shape is ObjectDefinitionLocalServiceImpl.deleteCompanyObjectDefinitions. Do not flag it.
        - A catch block that neither logs, rethrows, nor restores the interrupt flag; a background or poll loop whose body can throw and kill the thread; any retry/skip/fallback that logs nothing.
        - A new cache (static Map, ConcurrentHashMap, PortalCache, MultiVMPool) missing any of: a thread-safe type, a negative-result sentinel (never null for "checked, found nothing"), a named eviction owner, and a caller-scoped key namespace.
        - A new Thread not fully configured (name and setDaemon) before start().
        - A new public method or field with no caller outside its own module that could be private (keep the exposed surface minimal).

        Liferay review conventions, stricter than general Java style. Also flag:
        - Chained method calls on one statement; extract each intermediate to a named local. Builder APIs and stream pipelines are exempt.
        - Unsorted method parameter lists, and unsorted lists that have no inherent order.
        - A type name embedded in a variable name (userMap -> users), except for Function/Predicate/Consumer/Supplier where the type is the verb.
        - A fully-qualified type where the type is already imported.
        - A missing @Override on a method implementing or overriding an interface method.
        - Nested positive conditions where a guard clause would do.
        - A single-use anonymous class that should be inlined at the call site.
        - A method used only within its own class that is not private.

        Judgment CodeRabbit should apply (the formatter cannot):
        - Method names start with a verb and their plurality matches the return type; variable names describe the value, not its type (reject userMap, groupIdsList, queryString-style names); acronyms are fully uppercase (getGitHubAPIURL, JSONObject, tokenHTML) and a URL-holding String is named *URL.
        - New code matches its closest sibling in the same class or package (same idiom, same ordering); if the same operation appears more than once in the diff, it is written the same way each time.
        - Only suggest Javadoc when the closest sibling method in the same class or interface already has it; do not demand Javadoc where siblings have none.
    - path: "**/*Test*.java"
      instructions: |-
        Test-quality checks:
        - Every test asserts a specific expected value, not just non-null or existence. If changing the production code to return a wrong value would not fail this test, the test proves nothing — say so.
        - A present-only assertion on content that exists in more than one instance, tenant or partition passes even when the test lands on the wrong one. Flag it and name the absent-assertion that would catch it.
        - A test exercises the success path (not only permission-denied / bad-request helpers) and cleans up everything it creates in a finally block.
        - A success-path test that needs LogCapture or LoggerTestUtil to swallow ERROR output means the implementation emits real errors on the happy path — flag the implementation; do not accept hiding the log.
        - Prefer randomized inputs (RandomTestUtil) over fixed literals for values that are not asserted.
        - Flag an assertion carrying a descriptive message argument: drop it in favour of the bare assertion and a descriptive test method name. Exception: when asserting a collection size, the collection's toString() belongs in the message so a failure prints the contents.
        - Flag a test method name carrying a With<Context> or When<X> suffix rather than mirroring the method under test.
    - path: "**/rest-openapi.yaml"
      instructions: |-
        - Every operation's success (200) response needs a concrete description: a noun phrase naming the returned entity, ending with a period (e.g. "The imported portal instance."), never the builder default "default response".
        - Paired operations (export/import, add/update, copy) must read as one family: same description shape, same trailing punctuation, same "(e.g., <value>)" notation for value-format hints.
        - Field descriptions are prose, not code: write conditions in words ("a non-positive value", not "a value <= 0"); name the concrete entity ("the new portal instance", not "the copy"); use natural verbs.
        - A field marked `required` is only a client contract — confirm the server actually rejects its absence; `required` enforces nothing on its own.
        - A path segment must not duplicate its path-variable name (avoid project/{projectId}/{projectId}).
    - path: "**/*.sql"
      instructions: |-
        - Fully qualify every table and column; no single-letter aliases.
        - SELECT columns and AND clauses sorted, OR groups parenthesized; casing and format consistent with every sibling row in the file.
        - Avoid LIKE/ilike against a JSON-encoded column (brittle and slow); name the index that serves any new query.
        - All vendor variants of a query must agree on safety slots (casts, length caps, parameter units).
        - Flag uppercase SQL keywords and functions, missing spaces around operators, double-quoted string literals where single quotes belong, missing whitespace at concatenation seams, and trailing semicolons inside strings concatenated into a larger statement.
    - path: "test.properties"
      instructions: |-
        This file drives CI batch selection and sharding. Keys are grouped by suite and sorted alphabetically within a group, and the source formatter enforces that ordering. Flag a key inserted out of alphabetical order, and flag a duplicate key: a duplicated key here is silent, since the later definition simply wins and the earlier one is lost. When a key is added to a continuation list, check that no existing entry was dropped from that list.
    - path: "modules/test/playwright/**/*.ts"
      instructions: |-
        - Flag setup performed through non-UI APIs where the test's purpose is to exercise the UI.
        - Flag locators that rely on substring matching where an exact match is available; fixture names here are frequently prefixes of one another.
        - Flag present-only assertions on content that exists in more than one instance or partition, which pass even when navigation lands on the wrong one.
    - path: "**/Language.properties"
      instructions: |-
        - Each value is a complete sentence or a complete title, never a fragment, and grammatical for a native speaker (number and verb agreement).
        - A group of keys must not mix title-case-without-period and sentence-case-with-period entries; match the surrounding style.
        - A new key must be read by code somewhere, and the key name must still match the value after any reword.
    - path: "**/*.properties"
      instructions: |-
        Do NOT suggest adding or updating translations: localized Language_<locale>.properties files are generated by Liferay's Crowdin pipeline, never hand-authored in a PR. In portal.properties, the `_PERIOD_` token in environment-variable comments is intentional Liferay encoding — do not suggest LIFERAY_..._ENABLED-style replacements.

  # All 59 linters are enabled by default, including ones for languages this
  # repository does not contain. Each still runs against the diff. Only the
  # ones matching the stack — Java, TypeScript/JavaScript, properties, SQL,
  # shell, YAML, Markdown, GitHub workflows — are left on.
  tools:
    brakeman: { enabled: false }
    clang: { enabled: false }
    clippy: { enabled: false }
    cppcheck: { enabled: false }
    detekt: { enabled: false }
    emberTemplateLint: { enabled: false }
    fbinfer: { enabled: false }
    flake8: { enabled: false }
    fortitudeLint: { enabled: false }
    golangci-lint: { enabled: false }
    hadolint: { enabled: false }
    luacheck: { enabled: false }
    phpcs: { enabled: false }
    phpmd: { enabled: false }
    phpstan: { enabled: false }
    prismaLint: { enabled: false }
    psscriptanalyzer: { enabled: false }
    pylint: { enabled: false }
    regal: { enabled: false }
    rubocop: { enabled: false }
    ruff: { enabled: false }
    shopifyThemeCheck: { enabled: false }
    smartyLint: { enabled: false }
    swiftlint: { enabled: false }
    tflint: { enabled: false }
    verilator: { enabled: false }

chat:
  auto_reply: true

# NOTE: knowledge_base defaults are kept. The skill's dismissal replies
# ("...please skip this in future reviews") depend on learnings staying on,
# which is the default — do not opt out.
